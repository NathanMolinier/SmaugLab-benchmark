[tool.poetry]
name = "smaugbench"
# Placeholder only. The real version is substituted at build time by
# poetry-dynamic-versioning from the git tag. Do not bump this by hand.
version = "0.0.0"
description = "This package is a tool allowing simple and reproducible comparison between nnunet training."
readme = "README.md"
authors = [
    "Nathan Molinier <nathan.molinier@polymtl.ca>",
]
maintainers = [
    "Nathan Molinier",
]
homepage = "https://github.com/NathanMolinier/SmaugLab-benchmark"
repository = "https://github.com/NathanMolinier/SmaugLab-benchmark"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
    "deep learning",
    "image segmentation",
    "segmentation benchmark",
    "nnU-Net",
    "nnunet",
    "magnetic resonance imaging",
    "mri",
]
# smaugbench has no __init__.py anywhere, so it is a PEP 420 namespace package.
# poetry-core still walks the tree correctly; the CI build job and
packages = [{ include = "smaugbench" }]
# The config JSONs are package data, not code, so they need listing explicitly.
include = [{ path = "smaugbench/datasets/*.json", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.10"
smauglab = "*"

# Optional dependencies are declared as extras rather than poetry groups so
# that plain `pip install -e ".[dev]"` keeps working. Nothing here requires the
# poetry CLI or a poetry.lock -- only the build backend is poetry's.
nnunetv2 = { version = "*", optional = true }

[tool.poetry.extras]
nnunetv2 = ["nnunetv2"]

[tool.poetry.scripts]
smaugbench_reorient_image = "smaugbench.utils.reorient_image:main"
smaugbench_resample_image = "smaugbench.utils.resample_image:main"
smaugbench_create_splits_nnunet = "smaugbench.utils.create_splits_nnunet:main"
smaugbench_dataset_json_nnunet = "smaugbench.utils.create_dataset_json_nnunet:main"
smaugbench_compute_pairwise_measurements = "smaugbench.utils.compute_pairwise_measurements:main"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry-dynamic-versioning]
enable = true
# Strip an optional r/v/release- prefix; the rest becomes the version.
pattern = "^(?:[rvV]|release[-_])?(?P<base>\\d+(\\.\\d+)*)(?:[-.]?(?P<stage>[a-zA-Z]+)\\.?(?P<revision>\\d+)?)?"
# On a tag, the version is exactly the tag. Between tags, bump and mark .dev so
# the build still sorts AFTER the release it follows -- a plain "{base}.devN"
# would sort *before* it. No local version (+g<sha>), because PyPI rejects those.
#
# stage/revision must be carried through, or a pre-release tag like v1.0.0rc1
# would build as plain "1.0.0" and collide with the real 1.0.0 release.
format-jinja = """
{%- if distance == 0 -%}
{{ serialize_pep440(base, stage=stage, revision=revision) }}
{%- else -%}
{{ serialize_pep440(bump_version(base), stage=stage, revision=revision, dev=distance) }}
{%- endif -%}
"""